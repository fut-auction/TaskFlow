name: Deploy to Cloud Run

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
concurrency:
  group: taskflow-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint && npm test && npm run build
      - name: Authenticate using Workload Identity Federation (no JSON keys)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
      - name: Build production container
        run: docker build -t "${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/taskflow/taskflow:${{ github.sha }}" .
      - name: Push container to Artifact Registry
        run: docker push "${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/taskflow/taskflow:${{ github.sha }}"
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: taskflow
          region: ${{ vars.GCP_REGION }}
          image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/taskflow/taskflow:${{ github.sha }}
          env_vars: |
            OPENROUTER_MODEL=openai/gpt-4o-mini
            FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}
            FIREBASE_WEB_API_KEY=${{ vars.FIREBASE_WEB_API_KEY }}
            FIREBASE_AUTH_DOMAIN=${{ vars.FIREBASE_AUTH_DOMAIN }}
            FIREBASE_APP_ID=${{ vars.FIREBASE_APP_ID }}
          flags: >-
            --allow-unauthenticated
            --service-account=${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
            --set-secrets=OPENROUTER_API_KEY=taskflow-openrouter-key:1
      - name: Verify live health endpoint
        run: |
          curl --fail --silent --show-error "${{ steps.deploy.outputs.url }}/healthz"
          echo "Deployed URL: ${{ steps.deploy.outputs.url }}"
